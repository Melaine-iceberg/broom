name: broom
description: "A safe, reversible cache cleaner for Windows and Linux desktops."
publish_to: 'none'
version: 0.5.1+6

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  crypto: ^3.0.7
  intl: any
  lucide_icons_flutter: ^4.0.0
  path: ^1.9.0

dev_dependencies:
  flutter_driver:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
    - assets/fonts/harmonyos_sans_sc/LICENSE.txt
  fonts:
    - family: HarmonyOS Sans SC
      fonts:
        - asset: assets/fonts/harmonyos_sans_sc/HarmonyOS_Sans_SC_Regular.ttf
          weight: 400
        - asset: assets/fonts/harmonyos_sans_sc/HarmonyOS_Sans_SC_Medium.ttf
          weight: 500
        - asset: assets/fonts/harmonyos_sans_sc/HarmonyOS_Sans_SC_Bold.ttf
          weight: 700
