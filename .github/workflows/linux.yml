name: Linux CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  quality:
    name: Format, analyze, test, build
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libxml2-utils \
            libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test benchmark integration_test

      - name: Analyze (strict lint, unused code)
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build and test the system helper
        run: |
          cmake -S linux/system_helper -B build/system-helper \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build/system-helper --parallel
          ctest --test-dir build/system-helper --output-on-failure
          xmllint --noout build/system-helper/com.broom.Broom.policy

      - name: Validate packaging scripts
        run: |
          bash -n tool/package_linux.sh
          bash -n tool/package_rpm.sh

      - name: Build Linux release
        run: flutter build linux --release

      - name: Archive Linux bundle for RPM packaging
        run: tar -C build/linux/x64/release -czf build/broom-linux-bundle.tar.gz bundle

      - name: Upload Linux bundle
        uses: actions/upload-artifact@v7
        with:
          name: broom-linux-bundle
          path: build/broom-linux-bundle.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Package tar.gz
        run: bash tool/package_linux.sh

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: broom-linux-x64
          path: dist/broom-*-linux-x64.tar.gz*
          if-no-files-found: error
          retention-days: 14

  rpm:
    name: Build Fedora RPM
    needs: quality
    runs-on: ubuntu-22.04
    container: fedora:44
    timeout-minutes: 20
    steps:
      - name: Install RPM build dependencies
        run: |
          dnf install -y \
            cmake findutils gcc-c++ gzip git make rpm-build shadow-utils tar

      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Linux bundle
        uses: actions/download-artifact@v7
        with:
          name: broom-linux-bundle
          path: build

      - name: Extract Linux bundle
        run: tar -C build/linux/x64/release -xzf build/broom-linux-bundle.tar.gz

      - name: Prepare unprivileged builder
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Build RPM
        run: su builder -c "cd '$GITHUB_WORKSPACE' && bash tool/package_rpm.sh --skip-flutter-build"

      - name: Verify RPM metadata
        run: |
          rpm_file="$(find dist -maxdepth 1 -name 'broom-*.rpm' -type f | head -n 1)"
          test -n "$rpm_file"
          rpm -qp --qf '%{LICENSE}\n' "$rpm_file" | grep -qx MIT
          rpm -qp --dump "$rpm_file" |
            awk '$1 ~ /broom-system-helper$/ { print $5 }' | grep -qx 0100755
          rpm -qp --dump "$rpm_file" |
            awk '$1 ~ /Broom.policy$/ { print $5 }' | grep -qx 0100644
          rpm -qpl "$rpm_file" |
            grep -qx /usr/share/applications/com.broom.Broom.desktop
          rpm -qpl "$rpm_file" | grep -q '/usr/share/licenses/broom/LICENSE'

      - name: Upload RPM
        uses: actions/upload-artifact@v7
        with:
          name: broom-linux-rpm
          path: dist/broom-*.rpm*
          if-no-files-found: error
          retention-days: 14
